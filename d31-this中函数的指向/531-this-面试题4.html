<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var name = 'window'

        function Person (name) {
            this.name = name
            this.obj = {
                name:'obj',
                foo1:function () {
                    return function () {
                        console.log(this.name);
                    }
                }
            },
            foo2 = function () {
                return () => console.log(this.name);
            }
        }

        var person1 = new Person('person1')
        var person2 = new Person('person2')

        person1.obj.foo1()()//返回值和(),默认绑定:window
        person1.obj.foo1.call(person2)()//返回值和(),window
        person1.obj.foo1().call(person2)//返回值和主动绑定:person2

        person1.obj.foo2()()//上层作用域即foo2的this,由obj.foo2知this为obj,这里person1不是调用函数而是对象,函数有obj调用所以,foo2的this隐私绑定给obj
        person1.obj.foo2.call(person2)()//obj.foo2绑定给了person2,this即person2
        person1.obj.foo2().call(person2)//obj.foo2,this绑定给了obj,所以this是obj

    </script>
</body>
</html>
