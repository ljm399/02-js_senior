<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    var person1 = {
      name: 'person1',
      foo1 : function () {
        console.log(this.name)
      },
      foo2 : () => console.log(this.name),
      foo3 : function () {
        return function () {
          console.log(this.name)
        }
      },
      foo4 : function () {
        return () => console.log(this.name)
      }
    }

    var person2 = {
      name: 'person2'
    }

    person1.foo1.call(person2)//显示绑定person2

    person1.foo2()//箭头函数去上层作用域查找this,即window,对象没有作用域,
    //{}要么是对象,要么是作用域
    person1.foo2.call(person2)//foo2是箭头函数,没有this,所以指向window

    person1.foo3()()//第一个括号返回值,第二个是调用返回值,默认绑定:window
    person1.foo3.call(person2)()//指的是foo3主动绑定到了person2上,然后第二个括号调用foo3的返回值,返回值的this是默认绑定即window
    person1.foo3().call(person2)//第一个括号返回值,第二个是调用返回值,主动绑定:person2

    person1.foo4()()//返回值与(),默认绑定,但返回值是箭头函数,没有this,所以指外层函数,而外层函数因为person1.foo4()是隐式绑定到了person1上,所以指向person1
    person1.foo4.call(person2)()//返回值与(),指向外层函数的this:person2
    person1.foo4().call(person2)//返回值与(),指向外层函数的this:person1
  </script>
</body>
</html>
