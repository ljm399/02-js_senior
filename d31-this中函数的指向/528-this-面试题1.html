<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    var name = 'window';
    var person = {
      name: 'person',
      sayName : function () {
        console.log(this.name)
      }
    }
    function sayName() {
      var sss = person.sayName;

      sss();//默认绑定-window(箭头没有默认绑定)

      person.sayName();//隐式绑定,person

      (person.sayName)();//与上面一样,只不过加了个括号,更具有阅读

      (b = person.sayName)();//表达式的结果的调用,结果是sayName,如同var b = person.sayName;b();,默认绑定,window
    }
    sayName();
  </script>
</body>
</html>
