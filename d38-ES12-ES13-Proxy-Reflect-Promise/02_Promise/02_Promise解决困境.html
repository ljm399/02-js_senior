<!DOCTYPE html>

<body>
  <script>
    function exeCode(counter) {
      return promise = new Promise((resolve, reject) => {
        setTimeout(() => {
          if (counter > 0) {
            resolve("执行成功");
          } else {
            reject("执行失败");
          } 
        }, 1000);
    })
  }
    // //Es5之前都是这种写法,

    //   console.log("执行成功",value)
    // }, (err) => {
    //   console.log("执行失败",err)
    // })

    exeCode(200).then(value => {
      //value是resolve的返回值
      console.log('执行成功', value)
    }).catch(err => {
      console.log('执行失败', err)
    })


  </script>
</body>
</html>
