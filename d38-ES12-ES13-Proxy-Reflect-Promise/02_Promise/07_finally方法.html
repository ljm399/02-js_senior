<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const promise = new Promise((resolve, reject) => {
      resolve("Success!");
    })
    promise.then((value) => {
      console.log(value)
    }).catch((error) => {
      console.log(error)
    }).finally(() => {
      console.log("无论成功还是失败，都会执行")
    })


  </script>
</body>
</html>
