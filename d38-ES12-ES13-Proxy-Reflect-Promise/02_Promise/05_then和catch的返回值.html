<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const promise = new Promise((resolve, reject) => {
      // resolve("Success!");
      reject("Error!");

    })

    //then的返回值
    promise.then((res) => {
      console.log("第一个Promise的then方法",res); // "Success!"
      //1.普通值
      return "Success!"//相当于return Promise.resolve("Success!")

      //2.Promise对象
      // return new Promise((resolve, reject) => {
      //   setTimeout(() => {
      //   resolve('Success!')
      //   }, 1000)
      // })

      // // 3. thenable值
      // return {
      //   then: function(resolve) {
      //     resolve('thenable!')
      //   }

      // }

    }).then(res => {
      console.log("第二个Promise的then",res); // "Success!"
    })
    //当promise状态是reject时,直接跳到最近的reject,跳过前面的then方法
    .catch(err => {
      console.log('第一个Promise的catch方法',err); // "Error!"

    })


    //catch的返回值(少见)
    promise.catch(err => {
      console.log("第一个Promise的catch方法",err); // "Success!"
      return new Promise((resolve, reject) => {////也是返回了一个新的Promise对象，但是这个Promise对象的状态是rejected状态,则被之后的catch捕获到,要是resolve,则是then捕获到
        setTimeout(() => {
        reject('Error!')
        }, 1000)
      })
    }).then(res => {
      console.log("第二个Promise的then",res); // "Error!"
    }).catch(err => {
      console.log("第二个Promise的catch方法",err); // "Error!"
    })

  
  </script>
</body>
</html>
