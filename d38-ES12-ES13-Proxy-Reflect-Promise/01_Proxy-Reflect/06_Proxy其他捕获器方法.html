<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const obj = {
      name : 'codecao',
      age : 20,
    }

    //Proxy里有很多方法,这里列举常见的
    const objProxy = new Proxy(obj,{
      set: function(target, key, newvalue) {
        console.log("set",target,key,newvalue)//{name: 'codecao', age: 20} name codecao2
        target[key] = newvalue//不执行这句则不更新obj里面值
      },
      get: function(target, key) {
        console.log("get",target,key)
        return target[key]//不返回则undefined
      },

      deleteProperty: function(target, key) {
        console.log(`监听删除了${key}属性`)
        delete target[key]//不执行这句则不删除obj里面值
      },

      has: (target, key) => {
        console.log(`监听in判断${key}属性`)
        return key in target//不返回则false
      }

    })

    delete objProxy.name
    console.log("age" in objProxy)
    console.log(obj)

  </script>
</body>
</html>
