    //监听多个属性

      let value = obj[key]
      Object.defineProperty(obj, key, {
        set : function(newValue) {
          console.log(`监听: 给${key}属性赋值了`, newValue)
          value = newValue
        },
        get : function() {
          console.log(`监听: 获取了${key}属性值`)
          return value
        }
