<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let obj = {
      name : 'codecao',
      age : 18
    }

    let obj2 = {
      name : 'codecao2'
    }

    //当cpu空闲时,他才会回收,所以不会立刻有结果
    const finalRegistry = new FinalizationRegistry((value) => {
      console.log('某个对象被回收了', value)
    } )

    //先注册才能监听,后面参数为了辨别是那个对象被回收了
    finalRegistry.register(obj, 'codecao')
    finalRegistry.register(obj, 'codecao2')
    //使其不被引用则回收
    obj = null
  </script>
</body>
</html>
