<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //四个步骤

    const xhr = new XMLHttpRequest(); //第一步,创建对象
    console.log(XMLHttpRequest.UNSENT); //0
    console.log(XMLHttpRequest.OPENED); //1
    console.log(XMLHttpRequest.HEADERS_RECEIVED); //2
    console.log(XMLHttpRequest.LOADING); //3
    console.log(XMLHttpRequest.DONE); //4

    //只了解DONE即可
    xhr.onreadystatechange = function () {
      if (xhr.readyState === XMLHttpRequest.DONE) return
      console.log(xhr.responseText);
    }; //第二步

    xhr.open('GET', 'https://jsonplaceholder.typicode.com/posts'); //第三步

    xhr.send(); //第四步




  </script>
</body>
</html>
