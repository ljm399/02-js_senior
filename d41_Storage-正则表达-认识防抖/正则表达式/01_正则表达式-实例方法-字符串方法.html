<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    const re1 = /abc/ig
    const message = "abc abc abc 22"

    // 1.使用正则对象上的实例方法
    // 1.1 text()方法
    if (re1.test(message)) {
      console.log("找到了匹配项")
    } else {
      console.log("没有找到匹配项")
    }

    // 1.2 exec()方法
    const result = re1.exec(message)
    console.log(result)// 返回一个数组，如果没有找到匹配项则返回null
    //['abc', index: 4, input: 'abc abc abc', groups: undefined]


    // 2. 使用字符串上的实例方法
    // 2.1 match()方法
    const result2 = message.match(re1)
    console.log(result2) //  ['abc', 'abc', 'abc']

    // 2.2 matchAll()方法
    const result3 = message.matchAll(re1)
    console.log(result3) // 返回一个迭代器对象，可以使用for...of循环遍历
    // 处理迭代器方法
    //一
    console.log(result3.next())
    console.log(result3.next())
    console.log(result3.next())
    console.log(result3.next())
    //二
    // for (let item of result3) {
    //   console.log(item)
    // }

    console.log('----------')

    // 2.3 search()方法
    const result4 = message.search(re1)
    console.log(result4) // 0

    // 2.4 replace()方法
    const result5 = message.replace(re1, "ABC")
    console.log(result5) // ABC ABC ABC

    // 2.4.2 replaceAll()方法
    const result5_2 = message.replaceAll(re1, "ABC")
    console.log(result5_2) // ABC ABC ABC


    // 2.5 split()方法
    const result6 = message.split(re1)
    console.log(result6) // ['', '', '', '']
    
  </script>


  </script>
</body>
</html>
