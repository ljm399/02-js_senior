<!DOCTYPE html>

<head>

<body>
  <script src="./utils/Cache.js"></script>
  <script>
    const local = new Cache();
    const session = new Cache(false)
    local.setCache('name', 'local')

    // 名字相同，后面的会覆盖前面的
    session.setCache('name', 'session')
    session.setCache('name', 'session2')
    session.setCache('name2', 'session2')

    session.clear()
  </script>
