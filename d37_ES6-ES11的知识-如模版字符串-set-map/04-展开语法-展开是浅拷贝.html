<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    //展开运算符是浅拷贝
    function foo(age,name) {
      console.log(age,name)
    }
    const obj = {
      age : 20,
      name : 'john'
    }
    //不可以,展开运算符用于可迭代对象,obj不是一个可迭代对象
    // foo(...obj)

    //展开运算符应用在对象的场景
    let obj3 = {}
    const obj2 = {
      obj3 : obj3,
      ...obj,
    }
    console.log(obj2)
    console.log(obj3 === obj2.obj3)//true
  </script>
</body>
</html>
