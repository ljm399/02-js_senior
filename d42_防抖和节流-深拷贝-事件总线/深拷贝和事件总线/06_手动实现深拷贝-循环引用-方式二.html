<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script src="./utils/isObject.js"></script>
  <script>
    //方法一:不断创建map,然后还要在map = null去销毁,很麻烦(当然最好用weakmap)
    //最终优化:方法二
    function deepCopy(originValue, map = new WeakMap()) {
      //优化 let map = new WeakMap();每次递归都要创建新的map,所有把map放到函数的参数上

      // 0, 如果是symol类型(symobl是值),
      if (typeof originValue === 'symbol') {
        return Symbol(originValue.description); 
      }

      // 1.如果是原始类型，直接返回
      if(!isObject(originValue)) return originValue;

      // 2.如果是set类型(不能和下面的位置互换)
      if (originValue instanceof Set) {
        const newSet = new Set();
        for (const value of originValue) {
          newSet.add(deepCopy(value));//递归
        }
        return newSet
      }

      // 3. 如果是函数类型,不需要深拷贝,直接返回
      if (typeof originValue === 'function') return originValue;

      // 4.如果是数组/对象，创建一个空的对象或者数组
      const newObj = Array.isArray(originValue) ? [] : {};
      
      // 5. 解决循环引用的问题
      if (map.get(originValue)) return map.get(originValue)
      map.set(originValue, newObj);//目的是为了上一句

      // 只能遍历普通的key
      for (const key in originValue) {
        newObj[key] = deepCopy(originValue[key], map);//递归
      }

      // 遍历symbol类型的key
      const symbolKeys = Object.getOwnPropertySymbols(originValue);
      if (symbolKeys.length > 0) {
        for(const key of symbolKeys) {
          newObj[Symbol(key.description)] = deepCopy(originValue[key], map)
        }
      }
      return newObj;
    }



    
    const s1 = Symbol('s1');
    const s2 = Symbol('s2');
    const set = new Set([1,2,3]);
    const info = {

      // 1,普通类型
      name: "John",
      age: 30,

      // 2,对象
      address: {
        city: "New York",
      },

      // 3,数组
      hobbies: ["reading", "swimming"],

      // 4,set类型
      set,

      // 5,函数类型
      running: function() {
        return "running";
      },

      // 6,symbol类型
      // 6.1 symbol是值
      symbol : Symbol('s1'),

      // 6.2 symbol是键
      [s1]:'abc',
      [s2]:'abc',
    }
    info.self = info;
    console.log(info.self)
    console.log(deepCopy(info))//循环引用:RangeError: Maximum call stack size exceeded:因为前面的第37行的newObj[key] = deepCopy(originValue[key]);
  </script>
</body>
</html>
