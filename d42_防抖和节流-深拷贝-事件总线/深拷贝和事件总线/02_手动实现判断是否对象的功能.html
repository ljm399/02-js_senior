<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    function isObject(value) {
      const valueType = typeof value;
      //逻辑运算符: &&: 若左侧表达式为true，则返回右侧表达式的值；否则直接返回左侧表达式的值。
      // || : 若左侧表达式为true，则返回左侧表达式的值；否则直接返回右侧表达式的值。
      return (value !== null) && (valueType === 'object' || valueType === 'function');
    }

    const name = 'John';
    const age = 25;
    const obj = {}
    const foo = () => {}
    const bar = null;
    const arr = [];
    console.log(isObject(name)); // false
    console.log(isObject(age)); // false
    console.log(isObject(obj)); // true
    console.log(isObject(foo)); // true
    console.log(isObject(bar)); // false
    console.log(isObject(arr)); // true
    


  </script>
</body>
</html>
