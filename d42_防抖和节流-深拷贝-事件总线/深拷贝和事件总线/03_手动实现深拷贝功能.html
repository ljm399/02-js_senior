<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script src="./utils/isObject.js"></script>
  <script>
    function deepCopy(originValue) {
      // 0, 如果是symol类型(symobl是值),
      //必须放这里,因为typeof Symbol('s1')是symbol,isObject会返回false
      if (typeof originValue === 'symbol') {
        return Symbol(originValue.description); // 返回一个新的symbol对象，同时它的描述要和原来的相同
      }


      // 1.如果是原始类型，直接返回
      if(!isObject(originValue)) return originValue;

      // 2.如果是set类型(不能和下面的位置互换)
      if (originValue instanceof Set) {
        const newSet = new Set();
        for (const value of originValue) {
          newSet.add(deepCopy(value));//递归
        }
        return newSet
      }


      // 3. 如果是函数类型,不需要深拷贝,直接返回
      if (typeof originValue === 'function') return originValue;

  


      // 2.如果是对象，创建一个空的对象或者数组
      const newObj = Array.isArray(originValue) ? [] : {};
      
      // 只能遍历普通的key
      for (const key in originValue) {
        newObj[key] = deepCopy(originValue[key]);//递归
      }

      // 遍历symbol类型的key
      const symbolKeys = Object.getOwnPropertySymbols(originValue);
      if (symbolKeys.length > 0) {
        console.log(symbolKeys)//[Symbol(s1), Symbol(s2)]
        for(const key of symbolKeys) {
          //symbolkey.description是symbol的描述，如symbol('s1')的s1是它的描述
          newObj[Symbol(key.description)] = deepCopy(originValue[key])
        }
      }

      return newObj;
    }


    // set类型判断
    console.log(isObject(new Set([1,2,3])))//true,但set的添加方式是add,不是newObj[key] = deepCopy(originValue[key])

    // symbol类型判断
    const s1 = Symbol('s1')
    const s2 = Symbol('s2')
    console.log(isObject(s1))//fales
    // 但
    console.log(typeof s1)//symbol



    const set = new Set([1,2,3]);
    const info = {

      // 1,普通类型
      name: "John",
      age: 30,

      // 2,对象
      address: {
        city: "New York",
      },

      // 3,数组
      hobbies: ["reading", "swimming"],

      // 4,set类型
      set,

      // 5,函数类型
      running: function() {
        return "running";
      },

      // 6,symbol类型
      // 6.1 symbol是值
      symbol : Symbol('s1'),

      // 6.2 symbol是键
      [s1]:'abc',
      [s2]:'abc',
    }
    
    // 函数类型
    console.log(deepCopy(info).running())

    console.log(deepCopy(info))
  </script>
</body>
</html>
