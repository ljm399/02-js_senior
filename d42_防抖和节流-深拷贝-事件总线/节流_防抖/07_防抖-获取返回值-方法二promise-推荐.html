<body>
  <input type="text">
  <button class="cancel">取消</button>
  <script>
    function hydebounce(fn, delay, immediate = false) {
      let timer = null
      let isInvoke = false
      
      //不能用箭头函数,否则this执行hydebounce的this即window
      const _debounce = function (...argu) {
        //添加promise,不用删除什么,找个地方加层嵌套即可,然后返回值用resolve和reject包裹起来即可
        return new Promise((resolve, reject) => {
          try {
             //如果上次timer未在delay时间内执行,则清除上次的timer
             if(timer) clearTimeout(timer)
            let res = null
            //立刻执行功能
            if (immediate && !isInvoke) {

              //获取返回值
              res = fn.apply(this, argu)
              resolve(res)

              isInvoke = true
              return
            }

            timer = setTimeout(() => {
              res = fn.apply(this, argu)
              resolve(res)
              timer = null
            }, delay)
          } catch (error) {
            reject(error)
          }
        })

       
      }

      //取消功能
      _debounce.cancel = function () {
        clearTimeout(timer)
      }

      return _debounce
    }

    const inputEl = document.querySelector('input')
    const cancelBtn = document.querySelector('.cancel')
    let counter = 1

    //function的...argu是剩余参数,而不是展开语法
    const debounceFn = hydebounce(function (...argu) {
      //这里的...argu是展开语法
      console.log("发送网络请求${counter++}",...argu)
      return "哈哈哈哈我是返回值"
    }, 1000)
     
    
    //promise获取返回值( "哈哈哈哈我是返回值")
    //肯定只拿一次,而不是每次调用(oninput)都拿,所以这里不用inputEl.oninput 
    //获取的是函数内部fn的返回值,加promise也是把fn.apply的返回值包裹起来,至于其new Promise的{}有多大,能包裹就行
    debounceFn(event, "张三", 18).then(res => {
      console.log("获取成功",res)
    }).catch(err => {
      console.log("获取失败",err)
    })





  </script>
</body>
