<body>
  <input type="text">
  <!-- 本地引入 -->
  <script src="./js/undersocre.js"></script>
  </script>
  <script>
    const inputEl = document.querySelector('input')
    // 防抖处理input元素的输入
    // let counter = 1
    // inputEl.oninput = _.debounce(function () {
    //   console.log("发送网络请求${counter++}",this.value)
    // }, 1000)

    function hydebounce(fn, delay) {
      //记录上次事件触发的timer
      let timer = null
      
      //不能用箭头函数,否则this执行hydebounce的this即window
      const _debounce = function (...argu) {

        //如果上次timer未在delay时间内执行,则清除上次的timer
        if(timer) clearTimeout(timer)

        timer = setTimeout(() => {
          fn.apply(this, argu)
          timer = null
        }, delay)
      }
      return _debounce
    }

    // 自己实现防抖
    let counter = 1

    //触发input事件,会执行hydebounce函数,但不等于hydebounce的this指向input元素,而是hydebounce的返回值
    //hydebounce这样调用,其this执行window,而不是input
    inputEl.oninput = hydebounce(function (event) {
      //这里能拿到oninput的event是hydebounce函数里面的操作
      console.log("发送网络请求${counter++}",this.value, event)
    }, 1000)


  </script>
</body>
