<body>
  <input type="text">
  <script src="./js/undersocre.js"></script>
  <script>
    const inputEl = document.querySelector('input');
    
    // 节流处理代码
    // let counter = 1;
    // inputEl.oninput = _.throttle(function() {
    //   console.log("发送网络请求次数${counter++}",this.value)
    // },1000)

    //interval翻译: 间隔
    function hythrottle(fn, interval) {
      let startTime = Date.now(); // 记录开始时间

      const _throttle =  function() {
        const nowTime = new Date().getTime(); // 获取当前时间
        const waitTime  = interval - (nowTime - startTime); // 计算剩余等待时间
        if(waitTime <= 0) {
          fn()
          startTime = nowTime
        }
      }
      return _throttle;
    }

    let counter = 1;
    inputEl.oninput = hythrottle(function() {
      console.log("发送网络请求次数${counter++}")
    },1000)
  </script>

</body>
