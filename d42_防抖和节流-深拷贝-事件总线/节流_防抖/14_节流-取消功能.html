<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <input type="text">
  <button>取消</button>
  <script src="./js/undersocre.js"></script>
  <script>
    const inputEl = document.querySelector('input');

    //由于有多个参数,可以进行如下处理
    function hythrottle(fn, interval, { leading = true, trailing = false} = {}) {
      let startTime = 0; // 记录开始时间
      let timer = null; // 记录定时器


      const _throttle =  function(...argu) {
        const nowTime = new Date().getTime(); 

        if(!leading && startTime === 0) {
          startTime = nowTime; 
        }

        const waitTime  = interval - (nowTime - startTime); 
        if(waitTime <= 0) {
          fn.apply(this, ...argu)
          startTime = nowTime
          timer = null; // 重置定时器
          return
        }

        // 判断是否需要执行尾部
        if(trailing && !timer) {
          timer = setTimeout(() => {
            fn.apply(this, ...argu)
            // startTime = nowTime; //不能是nowTime,否则会连续执行两次
            startTime = new Date().getTime()
            timer = null
          }, waitTime)
        }
      }
      //取消功能
      _throttle.cancel = function() {
        // if(timer) clearTimeout(timer)
        //或
        timer && clearTimeout(timer)

        // 重置状态,即回到第一次点击状态
        startTime = 0

        timer = null;
      }

      return _throttle;
    }

    let counter = 1;
    const throttleFn = hythrottle(function(...argu) {
      console.log("发送网络请求次数${counter++}",this.value,'我是event'+ event)
    },1000, {trailing : true})
    inputEl.oninput = throttleFn;

    //取消功能
    const cancelBtn = document.querySelector('button');
    cancelBtn.onclick = function() {
      throttleFn.cancel();
    }

  </script>

</body>
</html>
