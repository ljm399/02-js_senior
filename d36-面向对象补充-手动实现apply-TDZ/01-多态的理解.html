<body>
  <script>
    // 为不同数据类型提供统一接口
    function sum(a1, a2) {
      return a1 + a2;
    }
    sum(1, 2)
    sum('abc', 'def')
    //不同操作,表现不同
    let a = 1
    a = {}
    //所以javascript到处是多态
  </script>
